name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# a new commit cancels the superseded run for the same branch
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: uncrustify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install uncrustify
        shell: bash
        run: |
          rm -f build.log
          set -o pipefail
          sudo apt-get update -qq 2>&1 | tee -a build.log
          sudo apt-get install -y -qq uncrustify 2>&1 | tee -a build.log
      - name: format
        shell: bash
        run: |
          # run per file: a crash on one file must not abort the whole tree
          find src -regextype posix-extended -path src/third-party -prune -o -type f -regex '.*\.(c|h|cpp|hpp)$' -print > files.txt
          while read -r f; do
            uncrustify -c uncrustify.cfg --replace --no-backup "$f" >> build.log 2>&1 || echo "UNCRUSTIFY_FAILED: $f" >> build.log
          done < files.txt
          rm -f files.txt
      - name: commit formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- src; then
            # only formatted sources belong in the tree, never the local
            # build.log or stray uncrustify scratch files
            find src -name '*.uncrustify' -delete
            git add src
            git commit -m "uncrustify: format tree [skip ci]"
            if ! git push; then
              # -X theirs: on a push race the newest output wins instead of
            # committing conflict markers
            git pull --rebase -X theirs origin ${{ github.ref }}
              git push
            fi
          fi
      - name: digest
        if: always()
        shell: bash
        env:
          LEG: uncrustify
          STATUS: ${{ job.status }}
        run: |
          cp build.log "log-$LEG.log" 2>/dev/null || true
          python .github/scripts/digest.py || true
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-uncrustify
          path: |
            log-uncrustify.log
            digest-fragment-uncrustify.md
            status-uncrustify
          if-no-files-found: ignore

  build:
    needs: format
    name: ${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.config }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        arch: [x86, x64]
        config: [debug, release]
    steps:
      - uses: actions/checkout@v4
      - name: clean stale log
        shell: bash
        run: rm -f build.log
      - name: free disk space
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # the Windows runners run out of disk during full builds
          rm -rf /c/Android /c/Miniconda3 /c/vcpkg || true
          df -h /c 2>&1 | tee -a build.log
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: install scons
        shell: bash
        run: |
          set -o pipefail
          pip install scons 2>&1 | tee -a build.log
      - name: install linux deps
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -o pipefail
          sudo dpkg --add-architecture i386 || true
          sudo apt-get update -qq 2>&1 | tee -a build.log
          sudo apt-get install -y -qq gcc-multilib g++-multilib 2>&1 | tee -a build.log
          # GL headers are arch independent, one install covers both legs
          sudo apt-get install -y -qq libgl-dev libglx-dev 2>&1 | tee -a build.log
          if [ "${{ matrix.arch }}" = "x86" ]; then
            sudo apt-get install -y -qq libx11-dev:i386 libxext-dev:i386 libxxf86dga-dev:i386 libxxf86vm-dev:i386 2>&1 | tee -a build.log
          else
            sudo apt-get install -y -qq libx11-dev libxext-dev libxxf86dga-dev libxxf86vm-dev 2>&1 | tee -a build.log
          fi
      - name: setup msvc environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}
      - name: cache scons objects
        uses: actions/cache@v4
        with:
          path: .scons_cache
          # no restore-keys: falling back to a cache from an older
          # SConstruct fills the disk with stale objects and slows
          # the restore down
          key: scons-${{ runner.os }}-${{ matrix.arch }}-${{ matrix.config }}-${{ hashFiles('SConstruct') }}
      - name: build
        shell: bash
        run: |
          set -o pipefail
          # -k keeps going so the digest lists every failing file in one run
          scons arch=${{ matrix.arch }} config=${{ matrix.config }} -j4 -k 2>&1 | tee -a build.log
      - name: digest
        if: always()
        shell: bash
        env:
          LEG: ${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.config }}
          STATUS: ${{ job.status }}
        run: |
          cp build.log "log-$LEG.log" 2>/dev/null || true
          python .github/scripts/digest.py || true
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.config }}
          path: |
            log-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.config }}.log
            digest-fragment-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.config }}.md
            status-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.config }}
          if-no-files-found: ignore

  publish:
    needs: build
    # a cancelled run (superseded by a newer push) must not publish its
    # partial logs: they race with the live run and corrupt the committed
    # build.log and build-digest.md
    if: always() && github.event_name == 'push' && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: logs-*
          merge-multiple: true
          path: logs
      - name: assemble
        run: |
          if ls logs/status-* >/dev/null 2>&1; then
            python .github/scripts/assemble.py
          else
            echo "no build logs to publish"
            exit 0
          fi
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch build.log build-digest.md
          git add build.log build-digest.md
          git diff --cached --quiet && exit 0
          git commit -m "CI: publish build log and digest [skip ci]"
          if ! git push; then
            # -X theirs: on a push race the newest output wins instead of
            # committing conflict markers
            git pull --rebase -X theirs origin ${{ github.ref }}
            git push
          fi
