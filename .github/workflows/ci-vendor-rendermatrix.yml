name: vendor-rendermatrix

on:
  push:
    branches: [master]

permissions:
  contents: write

# a superseded run exits at the skip check, so a queued run never needs
# to cancel an in flight one
concurrency:
  group: vendor-rendermatrix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check
        id: check
        run: |
          if [ -f src/idlib/geometry/RenderMatrix.cpp ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: fetch upstream
        if: steps.check.outputs.skip != 'true'
        run: |
          set -eu
          git clone --depth 1 https://github.com/id-Software/DOOM-3-BFG.git /tmp/doom3bfg
          # the file is too large for the contents API, so it is vendored
          # straight from the public upstream; the blob sha pins the
          # exact version so a moving upstream can never slip in silently
          hash=$(git -C /tmp/doom3bfg hash-object neo/idlib/geometry/RenderMatrix.cpp)
          if [ "$hash" != "b15e702a284f75e0f405213071acb3ff2ad229c2" ]; then
            echo "upstream blob sha changed: $hash"
            exit 1
          fi
      - name: vendor
        if: steps.check.outputs.skip != 'true'
        run: |
          set -eu
          mkdir -p src/idlib/geometry
          # the reference file includes the parallel job list headers,
          # which are not part of the ported idlib subset; the idlib
          # precompiled header covers everything the file needs
          sed 's|#include "../ParallelJobList_JobHeaders.h"|#include "../idlib/precompiled.h"|' \
            /tmp/doom3bfg/neo/idlib/geometry/RenderMatrix.cpp > src/idlib/geometry/RenderMatrix.cpp
          if grep -q '#include "../ParallelJobList_JobHeaders.h"' src/idlib/geometry/RenderMatrix.cpp; then
            echo "the parallel job include was not replaced"
            exit 1
          fi
      - name: commit
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/idlib/geometry/RenderMatrix.cpp
          git diff --cached --quiet && exit 0
          git commit -m "Vendor RenderMatrix.cpp from the public Doom 3 BFG source [skip ci]"
          if ! git push; then
            # -X theirs: on a push race the newest output wins instead of
            # committing conflict markers
            git pull --rebase -X theirs origin master
            git push
          fi
