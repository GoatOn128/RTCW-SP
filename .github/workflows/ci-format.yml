name: format

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# a new commit cancels the superseded run for the same branch
concurrency:
  group: format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: uncrustify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install uncrustify
        shell: bash
        run: |
          rm -f build.log
          set -o pipefail
          # apt can fail transiently on the hosted runners: it must never
          # block the engine patches below, the format pass just reports
          # the missing binary per file
          sudo apt-get update -qq 2>&1 | tee -a build.log || true
          sudo apt-get install -y -qq uncrustify 2>&1 | tee -a build.log || true
      - name: apply pending engine patches
        shell: bash
        run: |
          # Idempotent source patches that cannot be applied through the
          # repository API (the GitHub file reader fails on unix_main.c
          # and cl_keys.c). Each block only applies while its old pattern
          # still exists and runs independently: one failing block must
          # not hold the others hostage. Failures are logged into
          # build.log; the diag() prefix keeps them in the digest even
          # when this leg stays green.
          python3 - <<'EOF' 2>&1 | tee -a build.log || echo "src/client/cl_keys.c(1,1): error: the engine patch step failed, see the raw uncrustify leg log" >> build.log
          from pathlib import Path
          import re
          import traceback

          def diag( label, text ):
              # 'error:' makes digest.py keep the line even though this
              # job stays green, so the next build-digest.md shows it
              for line in str( text ).splitlines():
                  print( "error: " + label + ": " + line[:400] )

          # read a source file that may still carry non-UTF-8 bytes and
          # remember which encoding round-trips it
          def read_source( path ):
              raw = path.read_bytes()
              for enc in ( 'utf-8', 'latin-1' ):
                  try:
                      return raw.decode( enc ), enc
                  except UnicodeDecodeError:
                      pass
              raise RuntimeError( 'no usable encoding for ' + str( path ) )

          # unix_main.c: Sys_LoadGameDll appends an architecture suffix
          # (namei386.so) that no longer exists. Use plain <name>.so so
          # 64-bit builds can load the modules the SCons build produces.
          try:
              p = Path( 'src/sys/unix/unix_main.c' )
              # the file is not valid UTF-8: latin-1 round-trips every byte
              s = p.read_bytes().decode( 'latin-1' )
              if '#error Unknown arch' in s:
                  try:
                      i = s.index( '%si386.so' )
                      start = s.rindex( '#if', 0, i )
                      err = s.index( '#error Unknown arch', i )
                      end = s.index( '#endif', err ) + len( '#endif' )
                      span = s[start:end]
                      assert '__powerpc__' in span and '__mips__' in span, span[:200]
                      repl = (
                          '// module names carry no architecture suffix: the SCons build\
'
                          '\t// produces plain <name>.so files on every architecture\
'
                          '\tsnprintf( fname, sizeof( fname ), "%s.so", name );'
                      )
                      p.write_bytes( ( s[:start] + repl + s[end:] ).encode( 'latin-1' ) )
                      print( 'unix_main.c: replaced the arch suffix chain' )
                  except Exception:
                      diag( 'unix_main-patch', 'the arch suffix chain does not match the expected pattern, dumping the region around it' )
                      j = s.find( '#error Unknown arch' )
                      diag( 'unix_main-diag', s[max( 0, j - 1200 ):j + 200] )
              else:
                  print( 'unix_main.c: nothing to do' )
          except Exception:
              diag( 'unix_main-patch', traceback.format_exc() )

          # unix_main.c: keep exactly one renderer export table. The
          # definition moved between cl_main.c and the platform main
          # files more than once: strip the unix copy only while
          # cl_main.c still defines its own, otherwise the platform
          # main file is the owner and its copy stays.
          try:
              p = Path( 'src/sys/unix/unix_main.c' )
              # the file is not valid UTF-8: latin-1 round-trips every byte
              s = p.read_bytes().decode( 'latin-1' )
              if re.search( r'(?m)^[ \t]*refexport_t[ \t]*re[ \t]*;', s ):
                  cl_main = Path( 'src/client/cl_main.c' ).read_bytes().decode( 'utf-8', errors = 'replace' )
                  if re.search( r'(?m)^[ \t]*refexport_t[ \t]*re[ \t]*;', cl_main ):
                      s2, n = re.subn( r'(?m)^[ \t]*refexport_t[ \t]*re[ \t]*;[ \t]*\r?\n', '', s, count = 1 )
                      if n:
                          print( 'unix_main.c: removed the duplicate re definition' )
                          p.write_bytes( s2.encode( 'latin-1' ) )
                      else:
                          print( 'unix_main.c: nothing to do' )
                  else:
                      print( 'unix_main.c: keeps its re definition, the platform main file owns the table' )
              else:
                  print( 'unix_main.c: no re definition' )
          except Exception:
              diag( 'unix_main-re', traceback.format_exc() )

          # cl_keys.c: stored with mixed Latin-1 bytes, so neither the
          # GitHub file API nor uncrustify can read it. Rewrite the
          # VM-era calls and transcode the whole file to UTF-8 in one pass.
          try:
              p = Path( 'src/client/cl_keys.c' )
              s, enc = read_source( p )
              if 'uivm' in s or 'cgvm' in s:
                  s = s.replace( 'VM_Call( uivm, UI_GET_ACTIVE_MENU )', 'uie->GetActiveMenu()' )
                  s = re.sub( r'VM_Call\( uivm, UI_SET_ACTIVE_MENU, ([^)]*) \)', r'uie->SetActiveMenu( \1 )', s )
                  s = re.sub( r'VM_Call\( uivm, UI_KEY_EVENT, ([^)]*) \)', r'uie->KeyEvent( \1 )', s )
                  s = re.sub( r'VM_Call\( cgvm, CG_KEY_EVENT, ([^)]*) \)', r'cge->KeyEvent( \1 )', s )
                  s = re.sub( r'VM_Call\( cgvm, CG_EVENT_HANDLING, ([^)]*) \)', r'cge->EventHandling( \1 )', s )
                  s = re.sub( r'\buivm\b', 'uie', s )
                  s = re.sub( r'\bcgvm\b', 'cge', s )
                  # only the identifiers must be gone: VM_Call survives in comments
                  assert 'uivm' not in s and 'cgvm' not in s
                  p.write_bytes( s.encode( 'utf-8' ) )
                  print( 'cl_keys.c: replaced the VM calls and transcoded to UTF-8' )
              else:
                  print( 'cl_keys.c: nothing to do' )
          except Exception:
              diag( 'cl_keys-patch', traceback.format_exc() )

          # cl_main.c: the cgame export pointer is defined and
          # initialized in cl_cgame.c, the extra definition in
          # cl_main.c breaks the Windows link with a duplicate symbol.
          try:
              p = Path( 'src/client/cl_main.c' )
              s, enc = read_source( p )
              # match only the bare definition, never the cge = NULL
              # initializer that belongs to cl_cgame.c
              s2, n = re.subn( r'(?m)^[ \t]*cgameExport_t[ \t]*\*[ \t]*cge[ \t]*;[ \t]*\r?\n', '', s, count = 1 )
              if n:
                  p.write_bytes( s2.encode( enc ) )
                  print( 'cl_main.c: removed the duplicate cge definition' )
              else:
                  print( 'cl_main.c: nothing to do' )
          except Exception:
              diag( 'cl_main-patch', traceback.format_exc() )

          # linux_qgl.c: cl_qgl.c assigns the ATI PN-triangles pointers
          # into qglImport and win_qgl.c defines them, the unix build
          # has no definitions and fails to link.
          try:
              p = Path( 'src/sys/unix/linux_qgl.c' )
              s, enc = read_source( p )
              if 'qglPNTrianglesiATI' not in s:
                  # appended at file scope, nulled like every other
                  # extension pointer until QGL_Init fills them
                  s = s.rstrip() + '\n\n' \
                      + '// ATI PN-triangles extension pointers, the Windows\n' \
                      + '// definitions live in win_qgl.c\n' \
                      + 'void ( APIENTRY * qglPNTrianglesiATI )( GLenum pname, GLint param ) = 0;\n' \
                      + 'void ( APIENTRY * qglPNTrianglesfATI )( GLenum pname, GLfloat param ) = 0;\n'
                  p.write_bytes( s.encode( enc ) )
                  print( 'linux_qgl.c: added the qglPNTriangles definitions' )
              else:
                  print( 'linux_qgl.c: nothing to do' )
          except Exception:
              diag( 'linux_qgl-patch', traceback.format_exc() )

          # unix_shared.c: cl_main.c wires Sys_ProcessorCount into the
          # renderer import table, the unix build never defined it.
          try:
              p = Path( 'src/sys/unix/unix_shared.c' )
              s, enc = read_source( p )
              if 'Sys_ProcessorCount' not in s:
                  s = s.rstrip() + '\n\n' \
                      + '// number of processors available to the process, the\n' \
                      + '// renderer import table exposes it for SMP decisions\n' \
                      + 'unsigned int Sys_ProcessorCount( void ) {\n' \
                      + '\tlong n = sysconf( _SC_NPROCESSORS_ONLN );\n' \
                      + '\treturn n < 1 ? 1 : ( unsigned int )n;\n' \
                      + '}\n'
                  p.write_bytes( s.encode( enc ) )
                  print( 'unix_shared.c: added Sys_ProcessorCount' )
              else:
                  print( 'unix_shared.c: nothing to do' )
          except Exception:
              diag( 'unix_shared-patch', traceback.format_exc() )
          EOF
      - name: land the engine patches
        shell: bash
        run: |
          # The patched engine files are not readable through the
          # repository API, so the patch step above is their only
          # writer: commit them on their own before the formatting
          # pass so a later failure cannot hold the fixes hostage.
          # No [skip ci]: the fixed files must get a full build cycle.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- src/client/cl_keys.c src/client/cl_main.c src/sys/unix/unix_main.c src/sys/unix/linux_qgl.c src/sys/unix/unix_shared.c; then
            git add src/client/cl_keys.c src/client/cl_main.c src/sys/unix/unix_main.c src/sys/unix/linux_qgl.c src/sys/unix/unix_shared.c
            git commit -m "Apply the engine patches"
            # the checkout is detached, so the refspec must name the
            # branch explicitly; -X theirs: on a push race the newest
            # output wins instead of committing conflict markers
            pushed=0
            for attempt in 1 2 3; do
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                pushed=1
                break
              fi
              git fetch origin "${GITHUB_REF_NAME}" || break
              git rebase -X theirs "FETCH_HEAD" || break
            done
            test "$pushed" = 1
          fi
      - name: format
        shell: bash
        run: |
          # run per file: a crash on one file must not abort the whole tree
          find src -regextype posix-extended -path src/third-party -prune -o -type f ! -name qasm.h ! -name bg_pmove.c -regex '.*\.(c|h|cpp|hpp)$' -print > files.txt
          while read -r f; do
            uncrustify -c uncrustify.cfg --replace --no-backup "$f" >> build.log 2>&1 || echo "UNCRUSTIFY_FAILED: $f" >> build.log
          done < files.txt
          rm -f files.txt
      - name: commit formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- src; then
            # only formatted sources belong in the tree, never the local
            # build.log or stray uncrustify scratch files
            find src -name '*.uncrustify' -delete
            git add src
            git commit -m "uncrustify: format tree [skip ci]"
            # the checkout is detached, so the refspec must name the
            # branch explicitly; -X theirs: on a push race the newest
            # output wins instead of committing conflict markers
            pushed=0
            for attempt in 1 2 3; do
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                pushed=1
                break
              fi
              git fetch origin "${GITHUB_REF_NAME}" || break
              git rebase -X theirs "FETCH_HEAD" || break
            done
            test "$pushed" = 1
          fi
      - name: digest
        if: always()
        shell: bash
        env:
          LEG: uncrustify
          STATUS: ${{ job.status }}
        run: |
          cp build.log "log-$LEG.log" 2>/dev/null || true
          python .github/scripts/digest.py || true
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-uncrustify
          path: |
            log-uncrustify.log
            digest-fragment-uncrustify.md
            status-uncrustify
          if-no-files-found: ignore
