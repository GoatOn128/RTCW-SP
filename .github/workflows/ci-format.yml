name: format

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# a new commit cancels the superseded run for the same branch
concurrency:
  group: format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: uncrustify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install uncrustify
        shell: bash
        run: |
          rm -f build.log
          set -o pipefail
          sudo apt-get update -qq 2>&1 | tee -a build.log
          sudo apt-get install -y -qq uncrustify 2>&1 | tee -a build.log
      - name: apply pending engine patches
        shell: bash
        run: |
          # Idempotent source patches that cannot be applied through the
          # repository API (the GitHub file reader fails on unix_main.c
          # and cl_keys.c). Each block only applies while its old pattern
          # still exists and runs independently: one failing block must
          # not hold the others hostage. Failures are logged into
          # build.log; the diag() prefix keeps them in the digest even
          # when this leg stays green.
          python3 - <<'EOF' 2>&1 | tee -a build.log || echo "src/client/cl_keys.c(1,1): error: the engine patch step failed, see the raw uncrustify leg log" >> build.log
          from pathlib import Path
          import re
          import traceback

          def diag( label, text ):
              # 'error:' makes digest.py keep the line even though this
              # job stays green, so the next build-digest.md shows it
              for line in str( text ).splitlines():
                  print( "error: " + label + ": " + line[:400] )

          # unix_main.c: Sys_LoadGameDll appends an architecture suffix
          # (namei386.so) that no longer exists. Use plain <name>.so so
          # 64-bit builds can load the modules the SCons build produces.
          try:
              p = Path( 'src/sys/unix/unix_main.c' )
              # the file is not valid UTF-8: latin-1 round-trips every byte
              s = p.read_bytes().decode( 'latin-1' )
              if '#error Unknown arch' in s:
                  try:
                      i = s.index( '%si386.so' )
                      start = s.rindex( '#if', 0, i )
                      err = s.index( '#error Unknown arch', i )
                      end = s.index( '#endif', err ) + len( '#endif' )
                      span = s[start:end]
                      assert '__powerpc__' in span and '__mips__' in span, span[:200]
                      repl = (
                          '// module names carry no architecture suffix: the SCons build\n'
                          '\t// produces plain <name>.so files on every architecture\n'
                          '\tsnprintf( fname, sizeof( fname ), "%s.so", name );'
                      )
                      p.write_bytes( ( s[:start] + repl + s[end:] ).encode( 'latin-1' ) )
                      print( 'unix_main.c: replaced the arch suffix chain' )
                  except Exception:
                      diag( 'unix_main-patch', 'the arch suffix chain does not match the expected pattern, dumping the region around it' )
                      j = s.find( '#error Unknown arch' )
                      diag( 'unix_main-diag', s[max( 0, j - 1200 ):j + 200] )
              else:
                  print( 'unix_main.c: nothing to do' )
          except Exception:
              diag( 'unix_main-patch', traceback.format_exc() )

          # cl_keys.c: stored with mixed Latin-1 bytes, so neither the
          # GitHub file API nor uncrustify can read it. Rewrite the
          # VM-era calls and transcode the whole file to UTF-8 in one pass.
          try:
              p = Path( 'src/client/cl_keys.c' )
              raw = p.read_bytes()
              s = None
              for enc in ( 'utf-8', 'latin-1' ):
                  try:
                      s = raw.decode( enc )
                      break
                  except UnicodeDecodeError:
                      pass
              assert s is not None
              if 'VM_Call' in s or 'uivm' in s or 'cgvm' in s:
                  s = s.replace( 'VM_Call( uivm, UI_GET_ACTIVE_MENU )', 'uie->GetActiveMenu()' )
                  s = re.sub( r'VM_Call\( uivm, UI_SET_ACTIVE_MENU, ([^)]*) \)', r'uie->SetActiveMenu( \1 )', s )
                  s = re.sub( r'VM_Call\( uivm, UI_KEY_EVENT, ([^)]*) \)', r'uie->KeyEvent( \1 )', s )
                  s = re.sub( r'VM_Call\( cgvm, CG_KEY_EVENT, ([^)]*) \)', r'cge->KeyEvent( \1 )', s )
                  s = re.sub( r'VM_Call\( cgvm, CG_EVENT_HANDLING, ([^)]*) \)', r'cge->EventHandling( \1 )', s )
                  s = re.sub( r'\buivm\b', 'uie', s )
                  s = re.sub( r'\bcgvm\b', 'cge', s )
                  assert 'VM_Call' not in s and 'uivm' not in s and 'cgvm' not in s
                  p.write_bytes( s.encode( 'utf-8' ) )
                  print( 'cl_keys.c: replaced the VM calls and transcoded to UTF-8' )
              else:
                  print( 'cl_keys.c: nothing to do' )
          except Exception:
              diag( 'cl_keys-patch', traceback.format_exc() )
          EOF
      - name: land the cl_keys fix
        shell: bash
        run: |
          # cl_keys.c is not readable through the repository API, so the
          # patch above is its only writer: commit it on its own before
          # the formatting pass so a later failure cannot hold the
          # engine fix hostage. No [skip ci]: the fixed file must get a
          # full build cycle.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- src/client/cl_keys.c; then
            git add src/client/cl_keys.c
            git commit -m "Replace the cl_keys.c VM calls and fix its source encoding"
            # the checkout is detached, so the refspec must name the
            # branch explicitly; -X theirs: on a push race the newest
            # output wins instead of committing conflict markers
            pushed=0
            for attempt in 1 2 3; do
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                pushed=1
                break
              fi
              git fetch origin "${GITHUB_REF_NAME}" || break
              git rebase -X theirs "FETCH_HEAD" || break
            done
            test "$pushed" = 1
          fi
      - name: format
        shell: bash
        run: |
          # run per file: a crash on one file must not abort the whole tree
          find src -regextype posix-extended -path src/third-party -prune -o -type f ! -name qasm.h ! -name bg_pmove.c -regex '.*\.(c|h|cpp|hpp)$' -print > files.txt
          while read -r f; do
            uncrustify -c uncrustify.cfg --replace --no-backup "$f" >> build.log 2>&1 || echo "UNCRUSTIFY_FAILED: $f" >> build.log
          done < files.txt
          rm -f files.txt
      - name: commit formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- src; then
            # only formatted sources belong in the tree, never the local
            # build.log or stray uncrustify scratch files
            find src -name '*.uncrustify' -delete
            git add src
            git commit -m "uncrustify: format tree [skip ci]"
            # the checkout is detached, so the refspec must name the
            # branch explicitly; -X theirs: on a push race the newest
            # output wins instead of committing conflict markers
            pushed=0
            for attempt in 1 2 3; do
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                pushed=1
                break
              fi
              git fetch origin "${GITHUB_REF_NAME}" || break
              git rebase -X theirs "FETCH_HEAD" || break
            done
            test "$pushed" = 1
          fi
      - name: digest
        if: always()
        shell: bash
        env:
          LEG: uncrustify
          STATUS: ${{ job.status }}
        run: |
          cp build.log "log-$LEG.log" 2>/dev/null || true
          python .github/scripts/digest.py || true
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-uncrustify
          path: |
            log-uncrustify.log
            digest-fragment-uncrustify.md
            status-uncrustify
          if-no-files-found: ignore
